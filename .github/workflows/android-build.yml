name: Build and Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16'
        cache: 'npm'

    - name: Install NPM dependencies
      run: npm install

    - name: Build web assets
      run: |
        npm run build
        echo "Build completed"

    - name: List files before build
      run: |
        echo "Root directory:"
        ls -la
        echo "Android directory:"
        ls -la android/
        echo "Android app directory:"
        ls -la android/app/
        echo "Gradle files:"
        ls -la android/*.gradle android/gradle* 2>/dev/null || echo "No Gradle files found"
        echo "Gradle wrapper files:"
        ls -la android/gradlew* 2>/dev/null || echo "No Gradle wrapper files found"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      env:
        SKIP_JDK_VERSION_CHECK: true

    - name: Grant execute permission for gradlew
      run: |
        chmod +x android/gradlew
        ls -la android/gradlew

    - name: Check Gradle Wrapper
      run: |
        cd android
        echo "Gradle wrapper properties:"
        cat gradle/wrapper/gradle-wrapper.properties 2>/dev/null || echo "No gradle wrapper properties found"
        echo "Checking Gradle wrapper:"
        ls -la gradlew*

    - name: Build APK with verbose output
      run: |
        cd android
        echo "Available Gradle tasks:"
        ./gradlew tasks || echo "Failed to list tasks"
        echo "Building APK:"
        ./gradlew assembleDebug --stacktrace --info

    - name: List APK files
      run: |
        echo "APK directory structure:"
        find android/app/build -name "*.apk" 2>/dev/null || echo "No APK files found"
        echo "Full build output directory:"
        ls -la android/app/build/outputs/ 2>/dev/null || echo "Outputs directory not found"
        echo "Full build directory:"
        find android/app/build -type f 2>/dev/null | head -20 || echo "Build directory contents not found"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: android/app/build/outputs/apk/debug/app-debug.apk
        asset_name: word-match-app.apk
        asset_content_type: application/vnd.android.package-archive